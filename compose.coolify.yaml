services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_80
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: coolify
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: ${DATABASE_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PHOTO_STORAGE_PATH: ${PHOTO_STORAGE_PATH:-/data/photos}
      PHOTO_RETENTION_HOURS: ${PHOTO_RETENTION_HOURS:-24}
      LOBBY_EMPTY_GRACE_MINUTES: ${LOBBY_EMPTY_GRACE_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - photo-data:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  photo-data:
