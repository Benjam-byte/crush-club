<div class="ion-page">
  <ion-content>
    <main class="app-shell decorative-grid relative flex min-h-full flex-col items-center justify-center overflow-hidden px-5 py-8 text-center">
      <div class="absolute -left-16 top-16 size-48 rounded-full bg-brand-200/45 blur-3xl"></div>
      <div class="absolute -right-20 bottom-10 size-56 rounded-full bg-lover-500/10 blur-3xl"></div>

      <div class="relative z-10">
        <app-brand-mark size="large" />
      </div>

      <p class="relative z-10 mt-6 text-xs font-extrabold uppercase tracking-[0.18em] text-brand-600">
        Manche 1 sur 4
      </p>
      <h1 class="relative z-10 mt-2 text-4xl font-extrabold tracking-[-0.045em] text-ink-900">
        À quel point connais-tu <span class="text-brand-600">Camille&nbsp;?</span>
      </h1>
      <p class="relative z-10 mt-3 max-w-sm text-sm leading-6 text-ink-600">
        Tu es <strong class="text-ink-900">Cupidon</strong>. Construis le profil qui lui ressemble le plus.
      </p>

      <div class="role-portrait relative z-10 mt-7 size-52 overflow-hidden rounded-[38px] border-[6px] border-white">
        <app-profile-portrait class="block h-full" atlas="camille" [avatarIndex]="0" alt="Portrait fictif de Camille" />
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent px-4 pb-4 pt-12 text-left text-white">
          <p class="text-xl font-extrabold">Camille, 28</p>
          <p class="mt-0.5 text-xs font-semibold text-white/80">Amoureuse de la manche</p>
        </div>
      </div>

      <div class="relative z-10 mt-6 grid w-full grid-cols-3 gap-2">
        <div class="surface-card px-2 py-4">
          <p class="text-base font-extrabold text-brand-600">~ 6 min</p>
          <p class="mt-1 text-[10px] font-semibold text-ink-500">pour répondre</p>
        </div>
        <div class="surface-card px-2 py-4">
          <p class="text-base font-extrabold text-brand-600">1</p>
          <p class="mt-1 text-[10px] font-semibold text-ink-500">LOVER à miser</p>
        </div>
        <div class="surface-card px-2 py-4">
          <p class="text-base font-extrabold text-brand-600">100</p>
          <p class="mt-1 text-[10px] font-semibold text-ink-500">points en jeu</p>
        </div>
      </div>

      <ion-button class="action-button relative z-10 w-full" expand="block" (click)="onStartQuestionnaire()">
        Commencer à deviner
        <ion-icon name="arrow-forward" slot="end" aria-hidden="true" />
      </ion-button>
    </main>
  </ion-content>
</div>
