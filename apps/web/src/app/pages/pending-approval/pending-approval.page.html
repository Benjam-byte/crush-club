<div class="ion-page">
  <ion-content>
    <main class="app-shell min-h-full pb-8">
      <app-page-header title="Demande envoyée" backLink="/" />

      <section class="space-y-4 px-5 pt-3">
        @if (!gameState.isRealtimeConnected()) {
          <p class="rounded-2xl bg-warning-50 px-4 py-3 text-xs font-semibold text-warning-500">
            Reconnexion au lobby en cours…
          </p>
        }

        <div class="rounded-[26px] bg-gradient-to-br from-brand-500 to-coral-400 p-5 text-white shadow-floating">
          <p class="text-xs font-extrabold uppercase tracking-[0.14em] text-white/75">Partie en cours</p>
          <p class="mt-1 text-lg font-extrabold leading-snug">
            Salut {{ gameState.displayName() }} ! La partie a déjà commencé.
          </p>
          <p class="mt-2 text-xs font-semibold leading-5 text-white/85">
            Tu la rejoindras dès que l’hôte t’aura accepté·e. Tout le monde sera prévenu de ton arrivée.
          </p>
        </div>

        <app-waiting-card [title]="waitingTitle()" message="Garde cette page ouverte, elle s’actualise toute seule." />

        <ion-button class="w-full" expand="block" fill="outline" (click)="onCancel()">
          <ion-icon name="exit-outline" slot="start" aria-hidden="true" />
          Annuler ma demande
        </ion-button>
      </section>
    </main>
  </ion-content>
</div>
