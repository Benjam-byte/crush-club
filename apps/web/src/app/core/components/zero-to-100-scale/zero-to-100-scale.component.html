<div
  #rail
  class="scale"
  [class.scale--editable]="editable()"
  [style.height.px]="layout().height"
  [attr.role]="editable() ? 'group' : 'img'"
  [attr.aria-label]="editable() ? ariaLabel() : summary()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
  (click)="onTrackClick($event)"
>
  <div class="scale__track" [style.top.px]="layout().trackCenter" aria-hidden="true">
    @for (notch of ruler; track notch.value) {
      @if (notch.value > 0 && notch.value < scaleMax) {
        <span class="scale__notch" [class.scale__notch--middle]="notch.value * 2 === scaleMax" [style.left.%]="notch.percent"></span>
      }
    }
  </div>
  @for (notch of ruler; track notch.value) {
    <span
      class="scale__ruler"
      [class.is-occupied]="occupiedValues().has(notch.value)"
      [style.left.%]="notch.percent"
      [style.top.px]="layout().rulerTop"
      aria-hidden="true"
      >{{ notch.value }}</span
    >
  }

  @for (point of layout().points; track point.id) {
    <span
      class="scale__stem"
      [class.is-active]="point.id === activeId()"
      [style.left.%]="point.percent"
      [style.margin-left.px]="point.dotOffset"
      [style.top.px]="point.stemTop"
      [style.height.px]="layout().trackCenter - point.stemTop"
      [style.background]="point.color"
      aria-hidden="true"
    ></span>
    <span
      class="scale__name"
      [class.is-active]="point.id === activeId()"
      [attr.data-point-id]="point.id"
      [style.left.%]="point.percent"
      [style.top.px]="point.nameTop"
      [style.transform]="point.labelShift"
      aria-hidden="true"
    >
      <span class="scale__swatch" [style.background]="point.color"></span>
      <span class="scale__rank">{{ point.rankLabel }}</span>
      <span class="scale__name-text">{{ point.label }}</span>
    </span>
    <span
      class="scale__dot"
      [class.is-active]="point.id === activeId()"
      [attr.data-point-id]="point.id"
      [style.left.%]="point.percent"
      [style.margin-left.px]="point.dotOffset"
      [style.top.px]="layout().trackCenter"
      [style.background]="point.color"
      [attr.role]="editable() ? 'slider' : null"
      [attr.tabindex]="editable() ? 0 : null"
      [attr.aria-label]="editable() ? 'Note de ' + point.label : null"
      [attr.aria-valuemin]="editable() ? 0 : null"
      [attr.aria-valuemax]="editable() ? scaleMax : null"
      [attr.aria-valuenow]="editable() ? point.displayValue : null"
      [attr.aria-valuetext]="editable() ? point.displayValue + ' sur ' + scaleMax + ', ' + point.rankLabel : null"
      (keydown)="onKeydown($event, point)"
    ></span>
  }
</div>
