<header class="grid min-h-13 grid-cols-[2.5rem_minmax(0,1fr)_2.5rem] items-center gap-3 px-5 py-1.5">
  @if (backLink()) {
    <a
      class="grid size-10 shrink-0 place-items-center rounded-2xl text-ink-700 transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500"
      [routerLink]="backLink()"
      aria-label="Revenir à l'écran précédent"
    >
      <ion-icon name="arrow-back" class="text-xl" aria-hidden="true" />
    </a>
  } @else {
    <app-brand-mark size="compact" />
  }

  <div class="min-w-0">
    <h1
      class="text-lg font-extrabold tracking-tight text-ink-900"
      [class.truncate]="!wrapTitle()"
      [class.whitespace-pre-line]="wrapTitle()"
      [class.leading-tight]="wrapTitle()"
      [class.text-center]="centerTitle()"
    >
      {{ title() }}
    </h1>
  </div>

  @if (showSessionMenu()) {
    <button
      class="session-menu-button relative grid size-10 shrink-0 place-items-center bg-white/70 text-ink-700 transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500"
      type="button"
      [attr.aria-label]="
        pendingRequestCount() > 0
          ? 'Menu de la partie, ' + pendingRequestCount() + ' demande(s) en attente'
          : 'Menu de la partie'
      "
      (click)="openSessionMenu()"
    >
      <ion-icon name="ellipsis-horizontal" class="text-xl" aria-hidden="true" />
      @if (pendingRequestCount() > 0) {
        <span
          class="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-danger-500 px-1 text-[10px] font-extrabold text-white"
          aria-hidden="true"
          >{{ pendingRequestCount() }}</span
        >
      }
    </button>
  } @else if (showDecoration()) {
    <div class="grid size-10 place-items-center rounded-2xl bg-white/70 text-brand-400" aria-hidden="true">
      <ion-icon name="heart" />
    </div>
  } @else {
    <span class="size-10" aria-hidden="true"></span>
  }
</header>
@if (showSessionMenu() && !gameState.isRealtimeConnected()) {
  <p class="bg-warning-50 px-5 py-1 text-center text-xs font-semibold text-ink-700" role="status">
    Reconnexion au lobby…
  </p>
}
