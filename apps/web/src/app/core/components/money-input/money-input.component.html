<label class="block">
  <span class="money-input__label">{{ label() }}</span>
  <span class="money-input__field" [class.money-input__field--bump-a]="bumpParity()" [class.money-input__field--bump-b]="!bumpParity()">
    <input
      class="money-input__digits"
      type="text"
      inputmode="numeric"
      pattern="[0-9 ]*"
      autocomplete="off"
      enterkeyhint="done"
      placeholder="0"
      aria-describedby="money-input-hint"
      [value]="displayValue()"
      [disabled]="disabled()"
      (input)="onInput($event)"
    />
    <span class="money-input__currency" aria-hidden="true">€</span>
  </span>
</label>
<p id="money-input-hint" class="mt-1 min-h-5 text-center text-xs font-bold text-ink-500">
  {{ compactLabel() ?? 'En euros, de 0 € à 1 milliard.' }}
</p>
<div class="mt-3 flex justify-center gap-2">
  <button class="money-input__chip" type="button" [disabled]="disabled()" (click)="multiply(1000)">× 1 000</button>
  <button class="money-input__chip" type="button" [disabled]="disabled()" (click)="multiply(1_000_000)">× 1 M</button>
  <button class="money-input__chip money-input__chip--clear" type="button" [disabled]="disabled() || value() === null" (click)="clear()">
    Effacer
  </button>
</div>
