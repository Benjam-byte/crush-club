@if (players().length > 0) {
  <p class="truncate text-xs text-ink-600" role="status">
    On attend&nbsp;:
    @for (player of players().slice(0, 2); track player.id; let last = $last) {
      <span class="whitespace-nowrap">
        @if (!player.connected) {
          <ion-icon class="align-[-2px] text-warning-500" name="cloud-offline-outline" aria-hidden="true" />
        }
        {{ player.displayName }}
        @if (!player.connected) {
          <span class="sr-only">(hors ligne)</span>
        }
        {{ last ? '' : ', ' }}
      </span>
    }
    @if (players().length > 2) {
      <span>+{{ players().length - 2 }}</span>
    }
  </p>
}
