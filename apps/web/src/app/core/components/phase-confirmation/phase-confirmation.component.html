<section class="surface-card p-6 text-center" role="status" aria-live="polite">
  <ion-icon class="text-3xl text-success-500" name="checkmark-circle" aria-hidden="true" />
  <h2 class="mt-2 text-sm font-extrabold text-ink-900">{{ title() }}</h2>

  <ng-content />

  @if (progressCount() !== undefined && progressRequired() !== undefined) {
    <p class="mt-3 text-xs font-semibold text-ink-600">
      <strong class="text-ink-900">{{ progressCount() }}/{{ progressRequired() }}</strong>
      {{ progressLabel() }}.
    </p>
  }
  <p class="mt-1 text-xs text-ink-500">{{ message() }}</p>
</section>
