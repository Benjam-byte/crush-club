<article
  class="dating-card overflow-hidden bg-white"
  [class.dating-card--compact]="isCompact()"
  [class.h-full]="isCompact()"
>
  <div class="relative overflow-hidden" [class.h-72]="!isCompact()" [class.h-40]="isCompact()">
    <app-profile-portrait
      class="block h-full"
      atlas="camille"
      [avatarIndex]="avatarIndex()"
      alt="Portrait fictif de Camille"
    />
    <div class="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-black/70 to-transparent"></div>

    <div class="absolute left-4 top-4">
      @if (isOfficial()) {
        <span class="inline-flex items-center gap-1.5 rounded-full bg-white/95 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wide text-brand-600 shadow-md">
          <ion-icon name="checkmark-circle" aria-hidden="true" />
          Profil officiel
        </span>
      } @else if (authorName()) {
        <span class="rounded-full bg-white/95 px-3 py-1.5 text-[10px] font-extrabold text-ink-700 shadow-md">
          {{ authorName() }}
        </span>
      }
    </div>

    <div class="absolute inset-x-4 bottom-4 flex items-end justify-between gap-3 text-left text-white">
      <div>
        <p class="text-2xl font-extrabold tracking-tight">Camille, 28</p>
      </div>
      @if (matchPercentage(); as percentage) {
        <span class="rounded-full bg-brand-500 px-3 py-1.5 text-xs font-extrabold">{{ percentage }}%</span>
      }
    </div>
  </div>

  <div [class.p-5]="!isCompact()" [class.p-3]="isCompact()">
    <blockquote class="font-bold leading-relaxed text-brand-600" [class.text-sm]="!isCompact()" [class.text-xs]="isCompact()">
      “{{ tagline() }}”
    </blockquote>

    @if (!isCompact()) {
      <div class="mt-4 flex flex-wrap gap-2">
        <span class="profile-tag">Drôle</span>
        <span class="profile-tag">Têtue</span>
        <span class="profile-tag">Musique</span>
        <span class="profile-tag">Aventurière</span>
        <span class="profile-tag">Complicité</span>
      </div>
    }
  </div>
</article>
